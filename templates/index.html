<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Exercise Recommender System</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				padding: 20px;
			}

			.container {
				background: white;
				border-radius: 20px;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
				max-width: 600px;
				width: 100%;
				padding: 40px;
			}

			h1 {
				text-align: center;
				color: #667eea;
				margin-bottom: 10px;
				font-size: 2em;
			}

			.subtitle {
				text-align: center;
				color: #666;
				margin-bottom: 30px;
				font-size: 0.95em;
			}

			.form-group {
				margin-bottom: 20px;
			}

			label {
				display: block;
				margin-bottom: 8px;
				color: #333;
				font-weight: 600;
				font-size: 0.95em;
			}

			input[type='number'],
			select {
				width: 100%;
				padding: 12px;
				border: 2px solid #e0e0e0;
				border-radius: 8px;
				font-size: 1em;
				transition: all 0.3s ease;
			}

			input[type='number']:focus,
			select:focus {
				outline: none;
				border-color: #667eea;
				box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
			}

			.row {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 15px;
			}

			button {
				width: 100%;
				padding: 15px;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				border-radius: 8px;
				font-size: 1.1em;
				font-weight: 600;
				cursor: pointer;
				transition: transform 0.2s ease, box-shadow 0.2s ease;
				margin-top: 10px;
			}

			button:hover {
				transform: translateY(-2px);
				box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
			}

			button:active {
				transform: translateY(0);
			}

			#result {
				margin-top: 30px;
				padding: 25px;
				background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
				border-radius: 12px;
				display: none;
			}

			#result.show {
				display: block;
				animation: slideIn 0.5s ease;
			}

			@keyframes slideIn {
				from {
					opacity: 0;
					transform: translateY(20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.result-title {
				font-size: 1.5em;
				color: #667eea;
				margin-bottom: 15px;
				text-align: center;
				font-weight: 700;
			}

			.result-item {
				background: white;
				padding: 15px;
				margin-bottom: 12px;
				border-radius: 8px;
				border-left: 4px solid #667eea;
			}

			.result-item:last-child {
				margin-bottom: 0;
			}

			.result-label {
				font-weight: 600;
				color: #555;
				margin-bottom: 5px;
				font-size: 0.9em;
				text-transform: uppercase;
				letter-spacing: 0.5px;
			}

			.result-value {
				color: #333;
				font-size: 1.1em;
				font-weight: 500;
			}

			.error {
				background: #fff5f5;
				border-left-color: #e53e3e;
			}

			.error .result-value {
				color: #e53e3e;
			}

			.loading {
				text-align: center;
				color: #667eea;
				display: none;
				margin-top: 15px;
			}

			.loading.show {
				display: block;
			}

			.spinner {
				border: 3px solid #f3f3f3;
				border-top: 3px solid #667eea;
				border-radius: 50%;
				width: 40px;
				height: 40px;
				animation: spin 1s linear infinite;
				margin: 0 auto 10px;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			@media (max-width: 600px) {
				.row {
					grid-template-columns: 1fr;
				}

				.container {
					padding: 25px;
				}

				h1 {
					font-size: 1.6em;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>💪 Exercise Recommender</h1>
			<p class="subtitle">
				Get personalized exercise and equipment recommendations
			</p>

			<form id="recommendForm">
				<div class="form-group">
					<label for="sex">Sex</label>
					<select id="sex" name="sex" required>
						<option value="">Select...</option>
						<option value="Male">Male</option>
						<option value="Female">Female</option>
					</select>
				</div>

				<div class="row">
					<div class="form-group">
						<label for="age">Age (years)</label>
						<input
							type="number"
							id="age"
							name="age"
							min="1"
							max="120"
							required
						/>
					</div>

					<div class="form-group">
						<label for="height">Height (m)</label>
						<input
							type="number"
							id="height"
							name="height"
							step="0.01"
							min="0.5"
							max="3"
							required
						/>
					</div>
				</div>

				<div class="form-group">
					<label for="weight">Weight (kg)</label>
					<input
						type="number"
						id="weight"
						name="weight"
						step="0.1"
						min="20"
						max="300"
						required
					/>
				</div>

				<div class="row">
					<div class="form-group">
						<label for="hypertension">Hypertension</label>
						<select id="hypertension" name="hypertension" required>
							<option value="">Select...</option>
							<option value="No">No</option>
							<option value="Yes">Yes</option>
						</select>
					</div>

					<div class="form-group">
						<label for="diabetes">Diabetes</label>
						<select id="diabetes" name="diabetes" required>
							<option value="">Select...</option>
							<option value="No">No</option>
							<option value="Yes">Yes</option>
						</select>
					</div>
				</div>

				<div class="form-group">
					<label for="fitness_goal">Fitness Goal</label>
					<select id="fitness_goal" name="fitness_goal" required>
						<option value="">Select...</option>
						<option value="Weight Loss">Weight Loss</option>
						<option value="Weight Gain">Weight Gain</option>
						<option value="Maintain">Maintain</option>
					</select>
				</div>

				<div class="form-group">
					<label for="fitness_type">Fitness Type</label>
					<select id="fitness_type" name="fitness_type" required>
						<option value="">Select...</option>
						<option value="Cardio Fitness">Cardio Fitness</option>
						<option value="Muscular Fitness">
							Muscular Fitness
						</option>
						<option value="Flexibility">Flexibility</option>
					</select>
				</div>

				<button type="submit">Get Recommendation</button>
			</form>

			<div class="loading" id="loading">
				<div class="spinner"></div>
				<p>Analyzing your data...</p>
			</div>

			<div id="result">
				<div class="result-title">Your Personalized Recommendation</div>
				<div id="resultContent"></div>
			</div>
		</div>

		<script>
			document
				.getElementById('recommendForm')
				.addEventListener('submit', async (e) => {
					e.preventDefault();

					const loading = document.getElementById('loading');
					const result = document.getElementById('result');
					const resultContent =
						document.getElementById('resultContent');

					// Show loading
					loading.classList.add('show');
					result.classList.remove('show');

					// Get form data
					const formData = new FormData(e.target);

					try {
						const response = await fetch('/predict', {
							method: 'POST',
							body: formData,
						});

						const data = await response.json();

						// Hide loading
						loading.classList.remove('show');

						if (data.success) {
							resultContent.innerHTML = `
                        <div class="result-item">
                            <div class="result-label">BMI</div>
                            <div class="result-value">${data.bmi}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">Level</div>
                            <div class="result-value">${data.level}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">Recommended Exercises</div>
                            <div class="result-value">${data.exercise}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">Recommended Equipment</div>
                            <div class="result-value">${data.equipment}</div>
                        </div>
                    `;
						} else {
							resultContent.innerHTML = `
                        <div class="result-item error">
                            <div class="result-label">Error</div>
                            <div class="result-value">${data.error}</div>
                        </div>
                    `;
						}

						result.classList.add('show');
					} catch (error) {
						loading.classList.remove('show');
						resultContent.innerHTML = `
                    <div class="result-item error">
                        <div class="result-label">Error</div>
                        <div class="result-value">Failed to get recommendation. Please try again.</div>
                    </div>
                `;
						result.classList.add('show');
					}
				});
		</script>
	</body>
</html>
